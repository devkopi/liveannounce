name: LiveAnnounce
version: 1.4.0
main: org.ccoding.liveannounce.LiveAnnounce
api-version: "1.16"
author: ccoding
description: "Announce a live stream to the server"
softdepend:
  - PlaceholderAPI

commands:
  directo:
    description: "Announce your stream to the server"
    usage: "/live <url>"
    aliases: [live, stream, livestream]
    permission: liveannounce.directo

  liveannounce:
    description: "LiveAnnounce commands"
    usage: "/liveannounce [help|version|live|toggle]"
    aliases: [la]

permissions:
  liveannounce.directo:
    description: "Allows /directo to announce a stream"
    default: op

  liveannounce.directo.bypass.cooldown:
    description: "Skip the cooldown on /directo"
    default: op

  liveannounce.live:
    description: "View who is live with /la live"
    default: true

  liveannounce.toggle:
    description: "Hide stream announcements with /la toggle"
    default: true

  liveannounce.admin:
    description: "Full access to LiveAnnounce admin commands"
    default: op
    children:
      liveannounce.directo: true
      liveannounce.directo.bypass.cooldown: true
      liveannounce.live: true
      liveannounce.toggle: true
      liveannounce.admin.gui: true
      liveannounce.admin.history: true

  liveannounce.admin.gui:
    description: "Open the admin menu with /la admin"
    default: op

  liveannounce.admin.history:
    description: "View the announcement history"
    default: op
