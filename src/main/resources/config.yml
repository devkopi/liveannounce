# LiveAnnounce Configuration v1.1.5 - ¡MINIMESSAGE SUPPORT!
# ========================================
# MESSAGE FORMAT
# ========================================
# This plugin supports:
# - MiniMessage (recommended)
# - Legacy colors (&)
#
# IMPORTANT:
# Do NOT mix both formats in the same line.
# Supports PlaceholderAPI placeholders if installed
# ============================================
# PROXY CONFIGURATION - LiveAnnounce
# ============================================
proxy:
  # Enable or disable the proxy system completely
  # If set to false, will ONLY send to the local server
  enabled: false

  # Proxy type (options: "auto", "bungeecord", "velocity", "none")
  # - "auto": Automatically detects
  # - "bungeecord": Force BungeeCord
  # - "velocity": Force Velocity (Paper only)
  # - "none": No proxy, local only
  type: "auto"

  # Automatic detection (only applies if type: "auto")
  auto-detect: true

  # Velocity Config
  velocity-enabled: false  # Change to true ONLY if using Velocity AND Paper
  has-network: false      # Change to true ONLY if there is MORE THAN 1 server in the network

# ========== BASIC SETTINGS ==========
enabled: true
prefix: "&8[&bLiveAnnounce&8] &7"
# Supports PlaceholderAPI placeholders if installed
player-format: "%vault_prefix% %player_name%"

# ========== CONFIGURABLE MESSAGES ==========
messages:
  # Error messages
  unknown-command: "&cInvalid subcommand. Use &b/la help"
  no-permission: "&cYou don't have permission to execute this command."
  invalid-link: "&cInvalid link.&r &fSupported platforms: Twitch, YouTube, Kick, TikTok"
  invalid-link-example: "&fExample: &b/live https://twitch.tv/ccoding"
  player-only: "&cThis command can only be used by players."
  command-not-found: "&cCommand not found. Use /la help"

  # Success messages
  reloaded: "&aConfiguration reloaded successfully."
  enabled: "&aPlugin enabled."
  disabled: "&cPlugin disabled."

  # Status messages
  status-enabled: "&7Status: &aEnabled"
  status-disabled: "&7Status: &cDisabled"

# ========== PLATFORM COLORS CONFIGURATION ==========
platform-colors:
  twitch: "&d"      # Purple
  youtube: "&c"     # Red
  kick: "&a"        # Green
  tiktok: "&b"      # Aqua
  default: "&6"     # Gold

# ========== ANNOUNCEMENT FORMAT CONFIGURATION ==========
# Supports legacy colors (&) and MiniMessage (<gradient>, <rainbow>, <red>, etc.)
announcement-formats:
  default:
    line1: "<gradient:#555555:#aaaaaa><bold>--------------------------------------------------</bold></gradient>"
    title: "<yellow>⚡</yellow><reset> <white><bold>¡LIVE ON {platform_upper}!</bold></white> <yellow>⚡</yellow>"
    description: "<red>{player}</red><reset> <white>is now</white> <rainbow>streaming live</rainbow>"
    link: "<white>Join now!</white> <yellow>{link}</yellow>"
    hover: "<yellow>Click to open the <bold>stream</bold>!"
    line2: "<gradient:#555555:#aaaaaa><bold>--------------------------------------------------<bold></gradient>"

# ========== SOUNDS CONFIGURATION ==========
# Sound settings for announcements
sounds:
  # Enable/disable all sounds globally
  enabled: true
  # Play a sound to the command sender when successfully executed
  notify-sender: true

  # Sound played when a stream is announced (everyone hears it)
  announce:
    sound: "ENTITY_PLAYER_LEVELUP"
    volume: 1.0
    pitch: 1.0

  # Success sound for the command executor
  success:
    sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 0.5
    pitch: 1.0

# ========== DISCORD WEBHOOK CONFIGURATION ==========
discord:
  enabled: true
  webhook-url: "https://discord.com/api/webhooks/link-here"
  mention-everyone: true
  message: "🎮 ¡{player} is now streaming in {platform}!"

  # Platform specific colors (automatic URL detection)
  platform-colors:
    twitch: 9519747   # Twitch Purple
    youtube: 16711680 # YouTube Red
    kick: 5502200     # Kick Green
    facebook: 1602202 # Facebook Blue
    tiktok: 0         # TikTok Black
    unknown: 16766720 # Yellow for unknown platforms

  embed:
    # Default color (if platform is not found)
    color: 16711680

    title: "🎮 **¡{player} is live!**"
    description: "**Platform:** {platform}\n\n**Join now!**\n{link}"
    author: "🎥 New Live Stream"
    author-icon: "https://cdn-icons-png.flaticon.com/512/1388/1388210.png"
    footer: "LiveAnnounce • {timestamp}"
    # Image URL (supports static images and GIFs)
    # Example GIF: https://i.pinimg.com/originals/54/ad/ed/54aded2832204ae26b6c57ddf7ad4854.gif
    image-url: "https://i.imgur.com/TDf945M.jpeg"

# ========== ACTIVE LIVES (/la live) ==========
# After someone announces, the stream stays on this list.
# The list is kept in memory. Expired rows are deleted off the main thread.
# Do not mix MiniMessage and legacy colors (&) in the same line.
# If a line uses MiniMessage, do not use {color} (that placeholder is a legacy code).
live-sessions:
  enabled: true

  # How long a stream stays listed, in seconds.
  # 0 = no timer. Pair 0 with remove-on-quit: true.
  # If both would keep rows forever, the plugin uses a 6 hour cap.
  duration-seconds: 5400

  # true = remove the stream when that player leaves this server.
  # A stream announced on another server of the network is removed only by the timer.
  remove-on-quit: false

  # How often expired rows are deleted, in seconds. Minimum 10.
  cleanup-interval-seconds: 30

  # Rows printed in chat. The rest are counted, not printed. Maximum 50.
  max-display: 10

  messages:
    disabled: "&cThe live list is disabled."
    empty: "&7Nobody is live right now."
    header: "&6&lLIVE NOW"
    entry: "&f{player} &7on {color}{platform} &8• &e{channel} &8(&7{time}&8)"
    hover: "&eClick to open the stream"
    footer: "&7{count} live"
    more: "&8+{count} more"
    time-unlimited: "until disconnect"
